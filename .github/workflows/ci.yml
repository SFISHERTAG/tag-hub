name: CI

# The pre-commit hook is the fast feedback loop, but it is opt-in: it only runs
# on a machine where `npm run hooks:install` has been run, and `--no-verify`
# skips it entirely. This is the copy that cannot be skipped.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-story-status inspects the staged/changed set against the base,
          # so it needs more than the default single commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve the diff base
        # check:story-status and check:secret-scan read `git diff --cached` by
        # default, which is correct from pre-commit and empty on a runner. Both
        # were therefore passing here without reading a single file. TAG_DIFF_BASE
        # points them at the range this event actually introduces, and this step
        # fails rather than letting the range silently resolve to nothing.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          git cat-file -e "$BASE^{commit}" || { echo "::error::diff base $BASE is not a commit in this clone"; exit 1; }
          echo "TAG_DIFF_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Scanning $BASE...HEAD ($(git diff --name-only "$BASE...HEAD" | wc -l | tr -d ' ') files)"

      - name: Role list parity
        run: npm run check:role-parity

      - name: Story status and architecture constraints
        run: npm run check:story-status

      - name: Secret scan
        run: npm run check:secret-scan

      # Added 2026-08-29. These three were pre-commit only, which means they were
      # armed per clone by a manual `npm run hooks:install` and skippable with
      # --no-verify. CI is the only place a check cannot be forgotten or bypassed,
      # and a guard that depends on every clone having run an install step is a
      # guard with an unknown arming state.
      #
      # Each was run against main and observed GREEN before being added here. The
      # job's own note below is right that a check red on day one is one people
      # learn to delete, so nothing goes in on the assumption it passes.
      #
      # NOT added, and why, so the next person does not think they were missed:
      #   check:migrations   - needs tsx, which is not on PATH outside npm ci, so
      #                        it could not be observed green locally. Add it once
      #                        someone has watched it pass under a real install.
      #   check:story-parity - the script is not on main yet. Add it in the same
      #                        commit that lands guard/story-status-parity.
      - name: Story index
        run: npm run check:story-index

      - name: Inline role strings
        run: npm run check:role-strings

      - name: Firestore seam
        run: npm run check:firestore-seam

      # Aggregate repo state, not this change's state, which is why it does not
      # use TAG_DIFF_BASE like the two steps above. Deliberately here and not in
      # pre-commit: blocking a commit because some *other* branch is stale trains
      # people to bypass hooks, and that habit would eventually be carried into
      # the secret scan directly above. Blocking a merge to main is the right
      # altitude, because open loops are exactly what main should be clean of.
      #
      # Reads origin refs (--remote), not refs/heads, because a runner checkout
      # has exactly one local branch. Reading refs/heads here would be green
      # forever while guarding nothing, which is the same failure the diff-base
      # step above exists to fix.
      #
      # continue-on-error is TEMPORARY and has a defined removal condition.
      # REMOVE THIS LINE once `npm run check:loops` exits 0.
      #
      # That condition was previously UNREACHABLE, which is worth recording. On
      # a pull_request event the runner checks out refs/pull/N/merge, a commit
      # on no branch, and check-loop-closure counted the runner's own checkout
      # as a detached worktree with nothing containing it — the exact condition
      # --strict exits 1 on. So this step failed every run for a reason that had
      # nothing to do with the repository, and the gate it was meant to be has
      # never once fired. Fixed by skipping GITHUB_WORKSPACE; see CI_WORKSPACE
      # in scripts/check-loop-closure.mjs.
      #
      # What remains is real: origin still carries stale branches. Run
      # `npm run loops -- --remote` for the current list rather than trusting a
      # count written here. Close those and this line comes off.
      #
      # A check that is red on day one is one people learn to delete.
      - name: Open loops
        continue-on-error: true
        run: npm run check:loops

  next:
    name: Next app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        run: npm test
      # Lint was held out of this job because it had 47 pre-existing errors and
      # would have made CI red on day one. Commit 0c76cc2 cleared them, so it is
      # in now: 0 errors, 64 warnings. Warnings do not fail the run.
      - name: Lint
        run: npm run lint
      # The root `build` script is NOT `next build`, whatever CLAUDE.md's
      # "Build + test as the gate" section says. It is
      # `npm run web:build && stage-angular-bundle && next build`, so it shells
      # into the web workspace FIRST and dies with `ng: not found` unless that
      # workspace's dependencies exist. `npm ci` at the root does not install
      # them; only the angular job below does, in its own checkout.
      #
      # The Build step was added in f22bf90 without checking that, and turned
      # main red from that commit onward. Worth leaving the note: it landed in
      # the same commit that fixed two CI checks which passed without reading
      # anything, and it was a third check that could not run at all.
      - run: npm ci --prefix web
      - name: Build
        # lib/config.ts validates required keys at import, by design, so the
        # build cannot run without one. This value is a syntactic placeholder;
        # it authenticates nothing and reaches no service. Real secrets must not
        # go here, because a fork's pull request would be able to read them.
        env:
          FIREBASE_API_KEY: ci-placeholder-not-a-real-key
        run: npm run build

  angular:
    name: Angular gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # The three commands CLAUDE.md names as the phase gate, run separately so
      # a failure says which one.
      - name: Build
        run: npm run web:build
      - name: Lint
        run: npm run web:lint
      - name: Test
        run: npm run web:test

  functions:
    name: Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # functions/ has its own tsconfig, lockfile and test suite, and the root
      # `next build` never compiles it. CLAUDE.md calls this out because story
      # 1.8 landed auth code through a green root gate that had never seen it.
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
