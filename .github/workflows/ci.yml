name: CI

# The pre-commit hook is the fast feedback loop, but it is opt-in: it only runs
# on a machine where `npm run hooks:install` has been run, and `--no-verify`
# skips it entirely. This is the copy that cannot be skipped.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-story-status inspects the staged/changed set against the base,
          # so it needs more than the default single commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve the diff base
        # check:story-status and check:secret-scan read `git diff --cached` by
        # default, which is correct from pre-commit and empty on a runner. Both
        # were therefore passing here without reading a single file. TAG_DIFF_BASE
        # points them at the range this event actually introduces, and this step
        # fails rather than letting the range silently resolve to nothing.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          git cat-file -e "$BASE^{commit}" || { echo "::error::diff base $BASE is not a commit in this clone"; exit 1; }
          echo "TAG_DIFF_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Scanning $BASE...HEAD ($(git diff --name-only "$BASE...HEAD" | wc -l | tr -d ' ') files)"

      - name: Role list parity
        run: npm run check:role-parity

      - name: Story status and architecture constraints
        run: npm run check:story-status

      - name: Secret scan
        run: npm run check:secret-scan

  next:
    name: Next app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        run: npm test
      # Lint was held out of this job because it had 47 pre-existing errors and
      # would have made CI red on day one. Commit 0c76cc2 cleared them, so it is
      # in now: 0 errors, 64 warnings. Warnings do not fail the run.
      - name: Lint
        run: npm run lint
      - name: Build
        # lib/config.ts validates required keys at import, by design, so the
        # build cannot run without one. This value is a syntactic placeholder;
        # it authenticates nothing and reaches no service. Real secrets must not
        # go here, because a fork's pull request would be able to read them.
        env:
          FIREBASE_API_KEY: ci-placeholder-not-a-real-key
        run: npm run build

  angular:
    name: Angular gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # The three commands CLAUDE.md names as the phase gate, run separately so
      # a failure says which one.
      - name: Build
        run: npm run web:build
      - name: Lint
        run: npm run web:lint
      - name: Test
        run: npm run web:test

  functions:
    name: Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # functions/ has its own tsconfig, lockfile and test suite, and the root
      # `next build` never compiles it. CLAUDE.md calls this out because story
      # 1.8 landed auth code through a green root gate that had never seen it.
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
