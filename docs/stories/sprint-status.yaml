# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Story Status:
#   - backlog: Story only exists in epic file, or its story doc is still Draft
#   - ready-for-dev: Story doc written and ready to pick up
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review
#   - done: Story completed
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# LOCAL DEVIATIONS FROM THE BMAD DEFAULTS:
# ========================================
# 1. Story keys use the epic table's story title; the story FILES are named
#    `{epic}.{story}-{slug}.md`, so the key and the filename do not match character
#    for character. Match on the leading `{epic}-{story}` instead.
# 2. `Blocked` is not a legal status in the BMAD state machine, so blocked stories sit
#    at their true development status and the reason is recorded under `blocked:` below.
#    A blocked story is not the same as an unstarted one and must not be read as one.
# 3. A story doc whose Status is `Draft` maps to `backlog`, not `ready-for-dev`: the
#    file exists but is not something a developer can pick up.
#
# This file lives at {implementation_artifacts}/sprint-status.yaml, which is where every
# BMAD skill resolves it. That path was _bmad-output/implementation-artifacts until
# 2026-08-21; the directory never existed, so bmad-dev-story, bmad-create-story,
# bmad-sprint-status, bmad-code-review, bmad-quick-dev and bmad-retrospective were all
# reading into an empty tree. _bmad/bmm/config.yaml and _bmad/config.toml now point at
# docs/ and docs/stories/, where the artifacts actually are.
#
# Statuses are derived from each story's own `**Status:**` line, per Story 11.3 and the
# header of docs/epics.md. Regenerate by re-reading those, not by editing this by hand.

