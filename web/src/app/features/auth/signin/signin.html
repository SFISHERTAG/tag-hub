<main class="door">
  <!-- Decorative. The tab title and the favicon already name the product, and a
       screen reader announcing "TAG lion" before the form helps nobody. -->
  <img class="door__mark" src="lion-mark-lg.png" alt="" width="512" height="512" decoding="async" />

  @if (step() === 'email') {
    <form class="door__form" (ngSubmit)="submitEmail()">
      <!-- Placeholder, no label: the field asks for one thing and says so. A
           floating label would put the same word twice on a screen whose whole
           idea is that nothing is said that need not be.

           No autofocus. @angular-eslint bans it, and the accessible workaround —
           focusing programmatically on init — is the same behaviour with the
           linter switched off rather than answered. One field on an otherwise
           empty page is not hard to find. -->
      <input
        class="door__input"
        type="email"
        name="email"
        placeholder="Email"
        autocomplete="email"
        inputmode="email"
        aria-label="Email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        [disabled]="pending()"
      />

      <button class="door__quiet" type="submit" [disabled]="!canSubmitEmail()">Knock</button>
    </form>
  } @else {
    <form class="door__form" (ngSubmit)="submitCode()">
      <!-- Six boxes, one field. The group carries the label and the boxes are
           hidden from the accessibility tree individually, so a screen reader
           announces one code entry rather than six unrelated inputs. -->
      <div class="door__code" role="group" [attr.aria-label]="codeLength + '-digit code'">
        @for (i of digitIndexes; track i) {
          <input
            #digitInput
            class="door__digit"
            type="text"
            inputmode="numeric"
            maxlength="1"
            [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
            [attr.aria-label]="'Digit ' + (i + 1)"
            [value]="digitAt(i)"
            [disabled]="pending()"
            (input)="onDigitInput(i, $event)"
            (keydown)="onDigitKeydown(i, $event)"
            (paste)="onDigitPaste($event)"
          />
        }
      </div>

      <button class="door__quiet" type="submit" [disabled]="!canSubmitCode()">Enter</button>

      <div class="door__aside">
        <button class="door__whisper" type="button" (click)="resend()" [disabled]="!canResend()">
          @if (cooldownSeconds() > 0) {
            Resend in {{ cooldownSeconds() }}s
          } @else {
            Resend code
          }
        </button>
        <button class="door__whisper" type="button" (click)="backToEmail()">
          Different email
        </button>
      </div>
    </form>
  }

  @if (error(); as message) {
    <p class="door__error" role="alert">{{ message }}</p>
  }
</main>
