@if (loading()) {
  <app-loading-state variant="skeleton" [rows]="4" label="Loading the leads funnel" />
} @else if (error(); as message) {
  <app-error-state [message]="message" (retry)="load()" />
} @else if (stages(); as stages) {
  <app-sample-data-notice [disclosure]="sampleData()" [compact]="true" />

  @for (warning of warnings(); track warning.code) {
    <p class="funnel__warning" role="note">{{ warning.message }}</p>
  }

  <dl class="funnel__stages">
    @for (stage of stages; track stage.stage) {
      <div class="funnel__stage">
        <dt>{{ stage.stage }}</dt>
        <dd>{{ stage.count }}</dd>
      </div>
    }
  </dl>

  @if (days(); as days) {
    <p class="funnel__window">Last {{ days }} days</p>
  }
}
