<section class="settings">
  <h1>Settings</h1>

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Account</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="settings__email">{{ email() }}</p>
    </mat-card-content>
  </mat-card>

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Access</mat-card-title>
      <mat-card-subtitle>
        What this account is granted. Changes take effect after signing out and back in.
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (roles().length === 0) {
        <p>No roles granted.</p>
      } @else {
        <mat-chip-set>
          @for (role of roles(); track role) {
            <mat-chip [highlighted]="role === current()">{{ label(role) }}</mat-chip>
          }
        </mat-chip-set>
      }
    </mat-card-content>
  </mat-card>
</section>
