<div class="error-state" role="alert">
  <mat-icon class="error-state__icon" aria-hidden="true">{{ icon() }}</mat-icon>

  <p class="error-state__message">{{ message() }}</p>

  @if (detail(); as text) {
    <p class="error-state__detail">{{ text }}</p>
  }

  @if (retryable()) {
    <button matButton="outlined" type="button" class="error-state__action" (click)="retry.emit()">
      {{ retryLabel() }}
    </button>
  }
</div>
