<mat-toolbar>
  <!-- The mark, not the lockup. The lockup is 3:2 with a tagline under it, so
       at toolbar height it lands about 60px wide and the tagline is unreadable.
       The mark alone survives the size, and the title beside it already says
       the name. Alpha source, so it does not assume the toolbar stays black. -->
  <img class="app-mark" src="lion-mark.png" alt="" width="64" height="64" />
  <span class="app-title">{{ title() }}</span>
  <!-- Pushes the account control to the trailing edge. One control, both
       layouts — the toolbar is shared, so there is no second implementation to
       drift. -->
  <span class="toolbar-spacer"></span>
  <app-user-menu />
</mat-toolbar>

<!-- Above the sidenav container, not inside it: the banner must not scroll away
     with content. Somebody who has scrolled down is exactly the person who has
     forgotten whose tenant they are in. -->
<app-impersonation-banner />

<mat-sidenav-container class="shell">
  @if (isWide()) {
    <mat-sidenav mode="side" opened class="rail">
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a
            *hasPermission="item.permission"
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive="active-link"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>
  }

  <mat-sidenav-content class="content" [class.with-bottom-nav]="!isWide()">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

@if (!isWide()) {
  <nav class="bottom-nav">
    @for (item of navItems; track item.path) {
      <a
        *hasPermission="item.permission"
        mat-button
        [routerLink]="item.path"
        routerLinkActive="active-link"
        class="bottom-nav-item"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
}
