# Cloud Build → Artifact Registry → Cloud Run.
#
# DEPLOY WITH THIS FILE, NOT WITH `gcloud run deploy --source`.
#
#   gcloud builds submit --config=cloudbuild.yaml --substitutions=...
#
# `--source` does not read this file. It skips the --build-arg lines that inline
# NEXT_PUBLIC_FIREBASE_* into the client bundle, and it skips the
# check-substitutions step below that exists to stop exactly that. The result is
# a revision that starts cleanly, passes health checks, renders every page, and
# cannot sign anybody in — because the throw is in the browser, between two
# server calls, where nothing surfaces it. That happened on 2026-08-21 and took
# about four and a half hours to find. See docs/DEPLOYING_THE_APP.md.
#
# There is no push-to-main trigger, despite what this comment used to say.
# Deploys are a manual `gcloud builds submit`, which means SHORT_SHA and the two
# _FIREBASE_* substitutions below have to be passed on the command line; the
# empty defaults ship a build whose client-side auth cannot initialise. See
# DEPLOYMENT_STATUS.md for the exact command.

substitutions:
  _REGION: us-central1
  _REPO: hub
  # Deploys over the service already live at this name rather than standing up
  # a second one under a fresh URL. Two reasons this matters, not just one:
  # the existing revision there predates auth entirely and is reachable with
  # no login (safe today only because GHL_LOCATION_ID happens to be unset on
  # it — this deploy is what actually closes that), and the redirect URI
  # registered on the GHL marketplace app is pinned to this exact URL, so a
  # different service name would mean a different URL and a broken OAuth
  # callback until the marketplace app's redirect URI was updated to match.
  _SERVICE: tag-hub-git
  # Must match an SA that actually exists — this one already holds
  # datastore.user, firebaseauth.admin, secretmanager.secretAccessor.
  # (Verified by listing service accounts, not assumed — the first name
  # written here, hub-runtime@, does not exist and would have failed the
  # deploy step on first real run.)
  _RUNTIME_SA: hub-app@tag-success-hub.iam.gserviceaccount.com
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: tag-success-hub
  # None of these four are secrets — a Marketplace app's Client ID is visible
  # in the OAuth redirect URL itself, a GHL location id is visible in that
  # location's own dashboard URL, the callback path is public by definition,
  # and the sender is a support inbox. GHL_CLIENT_SECRET is the only one of
  # this group that actually needed Secret Manager, and it already has it.
  _GHL_CLIENT_ID: 6a7cc767e26aa70008be5b6f-msqhcvd9
  # TAG's own GHL sub-account — what the closer workspace (Epic 2) runs
  # against. Not a stand-in for per-client multi-tenant routing; that is
  # Story 1.2/1.6, still blocked on GHL account consolidation.
  _GHL_LOCATION_ID: rb6hPt8Ue77L4abghRMc
  # The origin this deployment is served from. Pins the CSRF Origin check on
  # every session-minting route to one exact value instead of falling back to
  # comparing Origin against Host. Must be scheme + host, no trailing slash.
  # Server-side key for the Identity Toolkit exchange. MUST be a runtime env var,
  # not only a --build-arg. lib/config.ts reads it via process.env[name] with a
  # dynamic key, and Next only inlines NEXT_PUBLIC_* when accessed STATICALLY, so
  # the build-arg below never reaches the running container. Without this the
  # config gate throws at import and every auth route 500s: nobody can sign in.
  _APP_ORIGIN: https://hub.taxadvisorygrowth.com
  # Google Identity Services sign-in client. Public by design — it ships in the
  # browser bundle. The server passes it to verifyIdToken as the expected
  # audience, so this value and web/src/environments/*.ts must stay identical or
  # every Google sign-in fails with a wrong-recipient error.
  #
  # Distinct from the Drive Picker's client, deliberately: the Picker uses a
  # sensitive scope, and sharing one client would drag sign-in into a
  # verification process it does not otherwise need.
  _GOOGLE_SIGNIN_CLIENT_ID: 872900877746-krfb0k16i2279qhkbqq93162sqvrjf4g.apps.googleusercontent.com
  # Must exactly match what's registered as the redirect URI on the GHL
  # Marketplace app. Changing one without the other breaks the OAuth callback,
  # and the GHL side is not editable from this repo.
  #
  # DO NOT DEPLOY until both are true: the hub.taxadvisorygrowth.com
  # certificate has issued, and the Marketplace app's redirect URI has been
  # changed to this value. Deploying earlier points the callback at a host that
  # does not serve yet.
  _GHL_REDIRECT_URI: https://hub.taxadvisorygrowth.com/api/oauth/callback
  _GMAIL_SENDER: support@taxadvisorygrowth.net
  # The origin used to build the one-click sign-in link in the code email.
  # Read from config rather than the request's Host header on purpose: a link
  # built from an attacker-supplied Host would be mailed to the real account
  # owner pointing at the attacker's site. Must be pinned to _SERVICE above,
  # same as _GHL_REDIRECT_URI, or the link lands on a URL that is not this
  # deployment.
  _PUBLIC_BASE_URL: https://tag-hub-git-vdsoboedgq-uc.a.run.app
  # tag-postgres (Cloud SQL) reached over the Unix socket Cloud Run mounts at
  # /cloudsql/<connection-name> when --add-cloudsql-instances is set below —
  # not a TCP host/port, so no public IP or authorized-networks exposure.
  _CLOUDSQL_CONNECTION_NAME: tag-success-hub:us-central1:tag-postgres
  _DB_NAME: tag_automation
  _DB_USER: tag_app_user

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

steps:
  # Fail the build, not the deployed container, when a required substitution is
  # missing. _FIREBASE_API_KEY defaults to "" and deploys are submitted by hand
  # with substitutions on the command line, so forgetting the flag used to mean
  # a green build that 500s on every auth route because lib/config.ts throws at
  # import. A failed build is a five-second fix; a broken sign-in is an outage.
  - id: check-substitutions
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        missing=""
        [ -z "${_FIREBASE_API_KEY}" ] && missing="$$missing _FIREBASE_API_KEY"
        if [ -n "$$missing" ]; then
          echo "Missing required substitution(s):$$missing"
          echo "Re-submit with --substitutions=_FIREBASE_API_KEY=<key>,..."
          exit 1
        fi
        echo "Required substitutions present."

  # Pull the previous image so unchanged layers are reused. Without this every
  # build reinstalls node_modules from scratch.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest || exit 0

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # The top-level `images:` list at the bottom of this file pushes only after
  # every step finishes — deploy cannot wait for that, so it needs its own
  # explicit push in between. Without this the deploy step asks Cloud Run for
  # an image that exists in this job's local Docker daemon but not yet in
  # Artifact Registry, and fails with "Image ... not found".
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      # Public ingress, but every route is gated by proxy.ts plus requireSession()
      # in the page itself. "Unauthenticated" here means Cloud Run does not add
      # its own IAM check — it does not mean the app is open.
      - --allow-unauthenticated
      # Dedicated identity, not the default compute account (AC #4). Firebase
      # Admin picks this up as Application Default Credentials, which is why no
      # service-account JSON is stored anywhere.
      - --service-account=${_RUNTIME_SA}
      # Mounts the Cloud SQL Auth Proxy sidecar; DB_HOST below points at the
      # Unix socket it exposes, not a network address.
      - --add-cloudsql-instances=${_CLOUDSQL_CONNECTION_NAME}
      # PHASE2/PHASE3_WEBHOOK_SECRET are used in both directions for their
      # phase: the app requires them on inbound calls to
      # /api/onboarding/intake-submit and /phase3-meta-setup from any caller
      # without a TAG staff session, and sends them as a bearer token on the
      # outbound call to the Cloud Function. Same names, same values, as
      # functions/package.json's deploy scripts already mount.
      #
      # Not optional. `authorizeOnboardingTrigger` refuses with a 500 when
      # there is no staff session and no configured secret — it fails closed
      # rather than falling open, so deploying without these takes GHL's
      # intake webhook offline instead of leaving it unauthenticated.
      - --set-secrets=GHL_CLIENT_SECRET=ghl-client-secret:latest,SLACK_BOT_TOKEN=slack-bot-token:latest,DB_PASSWORD=tag-postgres-password:latest,PHASE2_WEBHOOK_SECRET=phase2-webhook-secret:latest,PHASE3_WEBHOOK_SECRET=phase3-webhook-secret:latest
      # GHL_LOCATION_ID_TAG_GROWTH is the same sub-account as GHL_LOCATION_ID
      # above, under a second name: lib/dashboard/location-selection.ts reads
      # it separately to route internal roles (exec/CSM/sales) to TAG's own
      # location for the closer workspace, distinct from a client's location.
      # Introduced in code without being added here — every tag_exec/tag_csm/
      # tag_sales/tag_sales_manager hit on /closer/flow 500'd until this line
      # existed.
      - --set-env-vars=NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,MAIL_PROVIDER=gmail,APP_ORIGIN=${_APP_ORIGIN},FIREBASE_API_KEY=${_FIREBASE_API_KEY},GOOGLE_SIGNIN_CLIENT_ID=${_GOOGLE_SIGNIN_CLIENT_ID},GHL_CLIENT_ID=${_GHL_CLIENT_ID},GHL_LOCATION_ID=${_GHL_LOCATION_ID},GHL_LOCATION_ID_TAG_GROWTH=${_GHL_LOCATION_ID},GHL_REDIRECT_URI=${_GHL_REDIRECT_URI},GMAIL_SENDER=${_GMAIL_SENDER},PUBLIC_BASE_URL=${_PUBLIC_BASE_URL},DB_HOST=/cloudsql/${_CLOUDSQL_CONNECTION_NAME},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER}
      # GHL_PIT is deliberately absent. It is a single-location development
      # fallback, and leaving it set in production would let a token-resolution
      # bug silently serve one tenant's credential for every other tenant.
      # Story 1.7 dev notes call this out; --set-env-vars replaces the whole set
      # each deploy, so it cannot drift back in.
      - --min-instances=0
      - --max-instances=10
      - --cpu=1
      - --memory=512Mi
      - --timeout=60s
      - --port=8080
